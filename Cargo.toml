[package]
name = "padscreen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Use a Wi-Fi-only iPad as an extended monitor for a Linux laptop over USB-C"
license = "MIT"
readme = "README.md"
keywords = ["ipad", "second-screen", "screen-capture", "wayland", "h264"]
categories = ["multimedia::video"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = { version = "0.14.0", features = ["randr", "xtest"] }
zbus = { version = "5.13", default-features = false, features = ["tokio"] }

[dev-dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
